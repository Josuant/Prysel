packages:
  - packages/*
  - apps/*

# Una sola versión de cada dependencia compartida en todo el monorepo.
allowBuilds:
  esbuild: true

catalog:
  react: ^19.3.0
  react-dom: ^19.3.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@types/node': ^24.0.0
  typescript: ~6.0.3 # typescript-eslint aún no soporta TS 7
  vitest: ^5.0.1
  vite: ^8.3.0
  '@vitejs/plugin-react': ^6.1.1
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  culori: ^4.0.2
  '@types/culori': ^4.0.1
  eslint: ^9.39.0
  '@eslint/js': ^9.39.0
  typescript-eslint: ^8.70.0
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-jsx-a11y: ^6.10.2
  globals: ^17.12.0
  prettier: ^3.9.8

# Cadena de suministro: no se instalan versiones publicadas hace menos de 24 h.
minimumReleaseAge: 1440

# esbuild necesita su script de instalación para disponer del binario nativo.
