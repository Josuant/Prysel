# Publica la web de Prysel (apps/web) en GitHub Pages en cada push a `main` o a `web`.
name: Web en GitHub Pages

on:
  push:
    branches: [main, web]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'examples/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación cada vez; si llega otra, la que está en marcha se termina igual.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @prysel/web typecheck
      - run: pnpm --filter @prysel/web build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
